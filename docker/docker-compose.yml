services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  rabbitmq:
    image: rabbitmq:4.0-management
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "4318:4318"
      - "13133:13133"

  com-auth:
    build:
      context: ..
      dockerfile: com.auth/Dockerfile
    environment:
      OIDC_ISSUER_URI: http://keycloak:8080/realms/egm
      OIDC_AUTHORIZATION_URI: http://keycloak:8080/realms/egm/protocol/openid-connect/auth
      OIDC_TOKEN_URI: http://keycloak:8080/realms/egm/protocol/openid-connect/token
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/egm/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: egm
      KEYCLOAK_ADMIN_CLIENT_ID: egm-auth-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: change-me
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8082:8082"
    depends_on:
      keycloak:
        condition: service_started
      otel-collector:
        condition: service_started

  srv-cnm-services:
    build:
      context: ..
      dockerfile: srv.cnm.services/Dockerfile
    environment:
      ENV: local
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SPRING_RABBITMQ_HOST: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8080:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
      otel-collector:
        condition: service_started

  srv-iidm-transformer:
    build:
      context: ..
      dockerfile: srv.iidm.transformer/Dockerfile
    environment:
      ENV: local
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SPRING_RABBITMQ_HOST: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      IIDM_TRANSFORMER_PORT: 8098
    ports:
      - "8098:8098"
    depends_on:
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
      otel-collector:
        condition: service_started

  mock-srv-cnm-services:
    build:
      context: ..
      dockerfile: mock.srv.cnm.services/Dockerfile
    environment:
      ENV: local
      MOCK_CNM_SERVICES_PORT: 8084
    ports:
      - "8084:8084"

  srv-common-lfsa:
    build:
      context: ..
      dockerfile: srv.common.lfsa/Dockerfile
    environment:
      ENV: local
      LFSA_SERVICES_PORT: 8091
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_RABBITMQ_HOST: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8091:8091"
    depends_on:
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      otel-collector:
        condition: service_started

  mock-srv-common-lfsa:
    build:
      context: ..
      dockerfile: mock.srv.common.lfsa/Dockerfile
    environment:
      ENV: local
      MOCK_LFSA_SERVICES_PORT: 8092
    ports:
      - "8092:8092"

  srv-common-rao:
    build:
      context: ..
      dockerfile: srv.common.rao/Dockerfile
    environment:
      ENV: local
      RAO_SERVICES_PORT: 8093
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8093:8093"
    depends_on:
      otel-collector:
        condition: service_started

  mock-srv-common-rao:
    build:
      context: ..
      dockerfile: mock.srv.common.rao/Dockerfile
    environment:
      ENV: local
      MOCK_RAO_SERVICES_PORT: 8094
    ports:
      - "8094:8094"

  bpm-csa-service:
    build:
      context: ..
      dockerfile: bpm.csa.service/Dockerfile
    environment:
      ENV: local
      CSA_BPM_PORT: 8097
    ports:
      - "8097:8097"

  srv-csa-services:
    build:
      context: ..
      dockerfile: srv.csa.services/Dockerfile
    environment:
      ENV: local
      CSA_SERVICES_PORT: 8095
      LFSA_BASE_URL: http://srv-common-lfsa:8091
      RAO_BASE_URL: http://srv-common-rao:8093
      CSA_BPM_BASE_URL: http://bpm-csa-service:8097
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8095:8095"
    depends_on:
      srv-common-lfsa:
        condition: service_started
      srv-common-rao:
        condition: service_started
      bpm-csa-service:
        condition: service_started
      otel-collector:
        condition: service_started

  mock-srv-csa-services:
    build:
      context: ..
      dockerfile: mock.srv.csa.services/Dockerfile
    environment:
      ENV: local
      MOCK_CSA_SERVICES_PORT: 8096
    ports:
      - "8096:8096"

  gui-cnm-manager:
    build:
      context: ..
      dockerfile: gui.cnm.manager/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      srv-cnm-services:
        condition: service_started
      srv-iidm-transformer:
        condition: service_started

  gui-lfsa-manager:
    build:
      context: ..
      dockerfile: gui.lfsa.manager/Dockerfile
    ports:
      - "5176:80"
    depends_on:
      srv-common-lfsa:
        condition: service_started

  gui-rcc-manager:
    build:
      context: ..
      dockerfile: gui.rcc.manager/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      srv-cnm-services:
        condition: service_started
      srv-iidm-transformer:
        condition: service_started
      srv-common-lfsa:
        condition: service_started
      srv-csa-services:
        condition: service_started
