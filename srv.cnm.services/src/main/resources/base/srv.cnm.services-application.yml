spring:
  application:
    name: srv.cnm.services
  servlet:
    multipart:
      max-file-size: ${CNM_MAX_FILE_SIZE:16MB}
      max-request-size: ${CNM_MAX_REQUEST_SIZE:16MB}
server:
  port: ${CNM_SERVICES_PORT:8080}
  tomcat:
    connection-timeout: ${CNM_UPLOAD_CONNECTION_TIMEOUT:10m}
cnm:
  import:
    raw-bucket: cnm-rdf-models
    profile-payload-bucket: ${CNM_PROFILE_PAYLOAD_BUCKET:cnm-profile-payloads}
    profile-fragment-bucket: ${CNM_PROFILE_FRAGMENT_BUCKET:cnm-profile-fragments}
    network-snapshot-payload-bucket: ${CNM_NETWORK_SNAPSHOT_PAYLOAD_BUCKET:cnm-network-snapshot-payloads}
    recovery:
      enabled: ${CNM_IMPORT_RECOVERY_ENABLED:true}
      fixed-delay-ms: ${CNM_IMPORT_RECOVERY_FIXED_DELAY_MS:30000}
      stale-after-ms: ${CNM_IMPORT_RECOVERY_STALE_AFTER_MS:30000}
      requeue-throttle-ms: ${CNM_IMPORT_RECOVERY_REQUEUE_THROTTLE_MS:30000}
      scan-limit: ${CNM_IMPORT_RECOVERY_SCAN_LIMIT:500}
    metadata:
      slow-threshold-ms: ${CNM_METADATA_SLOW_THRESHOLD_MS:5000}
      mrid-index:
        enabled: ${CNM_MRID_INDEX_ENABLED:false}
    event:
      exchange: cnm.events
      dead-letter-exchange: cnm.events.dlx
      file-processing-routing-key: cnm.file.processing.requested
      file-processing-queue: cnm.file.process
      file-processing-dlq: cnm.file.process.dlq
      file-processing-dead-letter-routing-key: cnm.file.processing.failed
      snapshot-assembly-routing-key: cnm.snapshot.assembly.requested
      snapshot-assembly-queue: cnm.snapshot.assemble
      snapshot-assembly-dlq: cnm.snapshot.assemble.dlq
      snapshot-assembly-dead-letter-routing-key: cnm.snapshot.assembly.failed
      iidm-transform-exchange: iidm.events
      iidm-transform-dead-letter-exchange: iidm.events.dlx
      iidm-transform-routing-key: iidm.profile.transform.requested
      iidm-transform-queue: iidm.profile.transform
      iidm-transform-dlq: iidm.profile.transform.dlq
      iidm-transform-dead-letter-routing-key: iidm.profile.transform.failed.dlq
      iidm-transform-started-routing-key: iidm.profile.transform.started
      iidm-transform-started-queue: iidm.profile.transform.started.cnm
      iidm-transform-completed-routing-key: iidm.profile.transform.completed
      iidm-transform-completed-queue: iidm.profile.transform.completed.cnm
      iidm-transform-failed-routing-key: iidm.profile.transform.failed
      iidm-transform-failed-queue: iidm.profile.transform.failed.cnm
springdoc:
  swagger-ui:
    url: /openapi/cnm-services.yaml
