spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
utility:
  object-storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${vault:MINIO_SECRET_KEY}
    buckets: cnm-rdf-models,${CNM_PROFILE_PAYLOAD_BUCKET:cnm-profile-payloads},${CNM_PROFILE_FRAGMENT_BUCKET:cnm-profile-fragments},${CNM_NETWORK_SNAPSHOT_PAYLOAD_BUCKET:cnm-network-snapshot-payloads}
  messaging:
    listener:
      concurrent-consumers: ${CNM_RABBIT_CONCURRENT_CONSUMERS:8}
      max-concurrent-consumers: ${CNM_RABBIT_MAX_CONCURRENT_CONSUMERS:16}
      prefetch-count: ${CNM_RABBIT_PREFETCH_COUNT:1}
      retry:
        max-attempts: ${CNM_RABBIT_RETRY_MAX_ATTEMPTS:3}
        initial-interval-ms: ${CNM_RABBIT_RETRY_INITIAL_INTERVAL_MS:10000}
        multiplier: ${CNM_RABBIT_RETRY_MULTIPLIER:2.0}
        max-interval-ms: ${CNM_RABBIT_RETRY_MAX_INTERVAL_MS:60000}
    topic-exchange:
      name: cnm.events
      additional-names: iidm.events
