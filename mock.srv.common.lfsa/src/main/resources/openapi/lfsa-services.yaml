openapi: 3.0.3
info:
  title: Mock Common LF/SA Services API
  version: 0.1.0
paths:
  /api/common/lfsa/load-flow:
    post:
      summary: Run mocked load flow
      responses:
        '200': { description: Mock load-flow result }
  /api/common/lfsa/security-analysis:
    post:
      summary: Run mocked security analysis
      responses:
        '200': { description: Mock security-analysis result }
  /api/common/lfsa/imports:
    get:
      summary: Search mocked successful CNM imports
      responses:
        '200': { description: Mock import candidates }
  /api/common/lfsa/security-analysis/runs:
    post:
      summary: Start mocked asynchronous security analysis
      responses:
        '200': { description: Mock run summary }
    get:
      summary: Search mocked security-analysis runs
      responses:
        '200': { description: Mock run summaries }
  /api/common/lfsa/security-analysis/runs/{runId}:
    get:
      summary: Get mocked security-analysis run detail
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Mock run detail }
